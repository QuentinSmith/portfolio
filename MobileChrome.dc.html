<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;padding:0 20px;padding-top:env(safe-area-inset-top);background:rgba(8,14,28,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,196,61,.25)">
  <a href="Portfolio Home - Mobile.dc.html" aria-label="Quentin Smith, home" style="display:flex;align-items:center;gap:12px;color:#F2F4F8">
    <span style="width:32px;height:32px;background:#FFC43D;color:#0B1424;display:grid;place-items:center;font:700 13px 'Chakra Petch',sans-serif;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)">QS</span>
  </a>
  <span style="font:700 12px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#AEB8CC;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ label }}</span>
</header>

<div style="position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:35;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 14px;pointer-events:none">
  <sc-if value="{{ hasObj }}" hint-placeholder-val="{{ false }}">
    <button type="button" ref="{{ objRef }}" onClick="{{ objTap }}" style="pointer-events:auto;min-width:0;max-width:calc(100% - 74px);display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 16px 8px 14px;background:rgba(8,14,28,.94);border:1px solid rgba(255,196,61,.55);box-shadow:0 10px 28px rgba(0,0,0,.45);color:#F2F4F8;text-align:left;cursor:pointer;transform-origin:left bottom">
      <span style="position:relative;width:10px;height:10px;flex-shrink:0"><span data-anim="" style="position:absolute;inset:0;border:1.5px solid #FFC43D;transform:rotate(45deg);animation:qsPulse 1.8s ease-out infinite"></span><span style="position:absolute;inset:0;background:#FFC43D;transform:rotate(45deg)"></span></span>
      <span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font:700 11px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#FFC43D">OBJECTIVE</span><span style="font:600 15px/1.2 'Instrument Sans',sans-serif;color:#F2F4F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ obj }}</span></span>
    </button>
  </sc-if>
  <span style="flex:1"></span>
  <span aria-hidden="true" style="flex-shrink:0;width:56px;height:56px"></span>
</div>

<nav aria-label="Main" style="position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box;background:rgba(8,14,28,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,196,61,.35)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
    <a href="{{ t.href }}" aria-current="{{ t.cur }}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:{{ t.fg }}">
      <span style="position:absolute;top:-1px;left:22%;right:22%;height:3px;background:#FFC43D;opacity:{{ t.bar }}"></span>
      <span style="width:8px;height:8px;transform:rotate(45deg);box-sizing:border-box;background:{{ t.dot }};border:1.5px solid {{ t.dotBd }}"></span>
      <span style="font:700 13px 'Chakra Petch',sans-serif;letter-spacing:.12em;text-transform:uppercase">{{ t.label }}</span>
    </a>
  </sc-for>
</nav>

<div onClick="{{ closeContact }}" style="position:fixed;inset:0;z-index:50;background:rgba(4,8,18,.62);opacity:{{ sheetBgOp }};pointer-events:{{ sheetPe }};transition:opacity 220ms ease-out"></div>
<div style="position:fixed;right:42px;bottom:calc(100px + env(safe-area-inset-bottom));width:0;height:0;z-index:52">
  <nav role="menu" aria-label="Get in touch" aria-hidden="{{ sheetHidden }}" style="position:absolute;left:-200px;top:-200px;width:400px;height:400px;clip-path:{{ wheelMask }};pointer-events:none">
    <sc-for list="{{ wheel }}" as="w" hint-placeholder-count="4">
      <a href="{{ w.href }}" target="{{ w.target }}" rel="noopener" download="{{ w.download }}" role="menuitem" aria-label="{{ w.aria }}" tabindex="{{ w.tab }}" onClick="{{ closeContact }}" style="position:absolute;left:0;top:0;width:400px;height:400px;display:block;background:#FFC43D;clip-path:{{ w.outer }};transform:{{ w.tf }};opacity:{{ w.op }};pointer-events:{{ sheetPe }};transform-origin:50% 50%;transition:transform 340ms cubic-bezier(.2,.9,.25,1) {{ w.delay }},opacity 180ms ease-out {{ w.delay }}">
        <span style="position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#0F1E44 70px,#182B5C 196px);clip-path:{{ w.inner }}"></span>
        <img src="{{ w.icon }}" alt="" loading="eager" decoding="async" style="position:absolute;left:{{ w.cx }};top:{{ w.cy }};width:30px;height:30px;margin:-15px 0 0 -15px;object-fit:contain;display:block;filter:{{ w.filter }}">
      </a>
    </sc-for>
  </nav>
  <button type="button" onClick="{{ toggleContact }}" aria-label="{{ btnAria }}" aria-expanded="{{ contactOpenStr }}" style="position:absolute;left:-28px;top:-28px;width:56px;height:56px;display:grid;place-items:center;background:{{ btnBg }};border:1.5px solid #FFC43D;box-shadow:0 10px 28px rgba(0,0,0,.45);cursor:pointer;padding:0;transition:background 200ms ease-out">
    <img src="assets/icons/gmail.png" alt="" style="grid-area:1/1;width:24px;height:auto;display:block;opacity:{{ mailOp }};transform:rotate({{ mailRot }});transition:all 220ms ease-out">
    <span style="grid-area:1/1;font:700 26px/1 'JetBrains Mono',monospace;color:#0B1424;opacity:{{ sheetBgOp }};transform:rotate({{ xRot }});transition:all 220ms ease-out">×</span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 393, &quot;height&quot;: 852}, &quot;current&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;work&quot;, &quot;about&quot;, &quot;resume&quot;, &quot;none&quot;], &quot;default&quot;: &quot;work&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;obj&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;onObj&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { contact: false };
  objRef = React.createRef();
  TABS = [['home', 'Home', 'Portfolio Home - Mobile.dc.html'], ['work', 'Work', 'Work - Mobile.dc.html'], ['about', 'About', 'About - Mobile.dc.html'], ['resume', 'Resume', 'Resume - Mobile.dc.html']];
  WHEEL = [
    { label: 'EMAIL', aria: 'Email QuentinSmith.GD@gmail.com', href: 'mailto:QuentinSmith.GD@gmail.com', icon: 'assets/icons/gmail.png' },
    { label: 'LINKEDIN', aria: 'LinkedIn: quentin-t-smith', href: 'https://www.linkedin.com/in/quentin-t-smith/', icon: 'assets/icons/linkedin-white.png', ext: true },
    { label: 'ITCH.IO', aria: 'itch.io: slothdev-gd', href: 'https://slothdev-gd.itch.io/', icon: 'assets/icons/itch-white.png', ext: true },
    { label: 'RESUME', aria: 'Download resume (PDF)', href: 'assets/resume/Quentin_Smith_-_Resume_ATS.pdf', icon: 'assets/icons/document.svg', dl: 'Quentin_Smith_-_Resume.pdf', inv: true },
  ];
  componentDidMount() {
    this.onOpen = () => this.setState({ contact: true }); addEventListener('qs-open-contact', this.onOpen);
    this.onKey = (e) => { if (e.key === 'Escape' && this.state.contact) this.setState({ contact: false }); }; addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { removeEventListener('qs-open-contact', this.onOpen); removeEventListener('keydown', this.onKey); }
  componentDidUpdate(prev) {
    if (prev.obj !== this.props.obj && this.objRef.current && !matchMedia('(prefers-reduced-motion: reduce)').matches)
      this.objRef.current.animate([{ transform: 'scale(.86)', opacity: .4 }, { transform: 'scale(1.06)', opacity: 1, offset: .6 }, { transform: 'scale(1)' }], { duration: 360, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  }
  renderVals() {
    const cur = this.props.current, c = this.state.contact;
    return {
      label: this.props.label ?? '',
      hasObj: !!this.props.obj, obj: this.props.obj || '', objRef: this.objRef,
      objTap: () => { if (this.props.onObj) this.props.onObj(); },
      tabs: this.TABS.map(([k, label, href]) => { const on = k === cur; return { label, href, cur: on ? 'page' : 'false', fg: on ? '#FFC43D' : '#AEB8CC', bar: on ? 1 : 0, dot: on ? '#FFC43D' : 'transparent', dotBd: on ? '#FFC43D' : '#5A6785' }; }),
      contactOpenStr: c ? 'true' : 'false', sheetHidden: c ? 'false' : 'true', sheetBgOp: c ? 1 : 0, sheetPe: c ? 'auto' : 'none',
      arcScale: c ? 1 : 0.2, btnBg: c ? '#FFC43D' : 'rgba(8,14,28,.94)', btnAria: c ? 'Close contact menu' : 'Contact', mailOp: c ? 0 : 1, mailRot: c ? '90deg' : '0deg', xRot: c ? '0deg' : '-90deg',
      wheelMask: (() => { const p = ['200px 200px']; for (let k = 0; k <= 24; k++) { const t = (90 + 90 * k / 24) * Math.PI / 180; p.push(`${(200 + Math.cos(t) * 198).toFixed(1)}px ${(200 - Math.sin(t) * 198).toFixed(1)}px`); } return 'polygon(' + p.join(',') + ')'; })(),
      wheel: this.WHEEL.map((w, i, arr) => {
        const n = arr.length, span = 90 / n, Ri = 70, Ro = 196, Rc = 138, C = 200, rad = Math.PI / 180;
        const lo = 90 + i * span, hi = 90 + (i + 1) * span;
        // constant-width gap: angular inset shrinks with radius so every gap is the same px width
        const poly = (r1, r2, g) => { const pts = [], arc = (r, rev) => { const ins = (g / 2) / r / rad, a = lo + ins, b = hi - ins; for (let k = 0; k <= 12; k++) { const kk = rev ? 12 - k : k, t = (a + (b - a) * kk / 12) * rad; pts.push(`${(C + Math.cos(t) * r).toFixed(1)}px ${(C - Math.sin(t) * r).toFixed(1)}px`); } }; arc(r2, false); arc(r1, true); return 'polygon(' + pts.join(',') + ')'; };
        const mid = (lo + hi) / 2 * rad, d = (c ? i : n - 1 - i) * 45 + 'ms';
        return { ...w, target: w.ext ? '_blank' : '_self', download: w.dl, filter: w.inv ? 'brightness(0) invert(1)' : 'none', tab: c ? 0 : -1, op: c ? 1 : 0, delay: d,
          outer: poly(Ri, Ro, 8), inner: poly(Ri + 2, Ro - 2, 12),
          cx: (C + Math.cos(mid) * Rc).toFixed(1) + 'px', cy: (C - Math.sin(mid) * Rc).toFixed(1) + 'px',
          tf: c ? 'scale(1)' : 'scale(.4)' };
      }),
      toggleContact: () => this.setState(s => ({ contact: !s.contact })), closeContact: () => this.setState({ contact: false }),
    };
  }
}
</script>
</body>
</html>
