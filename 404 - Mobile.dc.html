<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="device.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1A3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0B1A3A;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:#FFC43D;text-decoration:none}
a:hover{color:#FFFFFF}
@keyframes qsPulse{0%{transform:rotate(45deg) scale(1);opacity:.75}70%,100%{transform:rotate(45deg) scale(2.8);opacity:0}}
</style>
<script src="transition.js"></script>
</helmet>
<div data-screen-label="404 · mobile" style="min-height:100vh;color:#F2F4F8;font-family:'Instrument Sans',sans-serif;background-color:#0B1A3A;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:20px 20px;overflow-x:clip">
  <dc-import name="MobileChrome" current="none" label="Error 404" hint-size="100%,56px"></dc-import>
  <main style="display:flex;flex-direction:column;align-items:flex-start;gap:24px;padding:40px 24px calc(150px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;box-sizing:border-box">
    <span style="font:700 12px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#FFC43D">ERROR 404 · OUT OF BOUNDS</span>
    <div aria-hidden="true" style="position:relative;width:100%;aspect-ratio:16/9;border:1px solid rgba(255,196,61,.35);background:rgba(8,14,28,.6);overflow:hidden">
      <div style="position:absolute;left:8%;right:8%;bottom:28%;height:10px;background:#2B3550"></div>
      <div style="position:absolute;left:42%;width:16%;bottom:28%;height:10px;background:#0B1A3A;border-left:2px dashed #FF00FF;border-right:2px dashed #FF00FF;box-sizing:border-box"></div>
      <div style="position:absolute;left:14%;bottom:calc(28% + 10px);width:18px;height:34px;border-radius:9px;background:#C9D1E0"></div>
      <div style="position:absolute;right:12%;bottom:calc(28% + 10px);width:34px;height:44px;border:2px solid #FFC43D;border-bottom:0;box-sizing:border-box;display:grid;place-items:center;font:700 10px 'JetBrains Mono',monospace;color:#FFC43D">HOME</div>
      <div style="position:absolute;left:8%;right:8%;bottom:12%;border-top:1.5px dashed #FF5A5A"></div>
      <span style="position:absolute;left:8%;bottom:4%;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#FF5A5A">KILL Z · -404</span>
    </div>
    <h1 style="margin:0;font:700 46px/.95 'Chakra Petch',sans-serif;text-transform:uppercase;color:#FFFFFF">Level not found</h1>
    <p style="margin:0;font:400 17px/1.6 'Instrument Sans',sans-serif;color:#DCE4F5;text-wrap:pretty">You walked off the edge of the map. This page doesn’t exist, or it moved. The playable version of this level is on the desktop site.</p>
    <a href="Portfolio Home - Mobile.dc.html" style="display:flex;align-items:center;justify-content:center;gap:12px;align-self:stretch;min-height:52px;background:#FFC43D;color:#0B1424;font:700 16px 'Chakra Petch',sans-serif;letter-spacing:.08em;text-transform:uppercase">Respawn at home</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 393, &quot;height&quot;: 852}}"></script>
</body>
</html>
